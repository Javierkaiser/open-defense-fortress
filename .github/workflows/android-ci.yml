name: Android CI (debug)

# Build manual: no compila en cada push para no gastar minutos.
# GitHub -> Actions -> "Android CI (debug)" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar platform 36 + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Tests del juego
        run: node --test "tests/**/*.mjs"

      - name: Web + Capacitor
        run: |
          cd mobile
          npm ci
          node scripts/build-web.mjs
          npx cap sync android

      - name: Build debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: open-defense-fortress-debug-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
