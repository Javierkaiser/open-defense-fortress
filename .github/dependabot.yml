# Dependabot — Open Defense Fortress
#
# El runtime es zero-dependency; la única devDependency es esbuild (bundle de
# deploy). Vigilamos las GitHub Actions y el paquete npm del deploy.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Cordoba"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Las actions menores y de parche se agrupan: no se contradicen entre sí
      # porque no hay dependencias de runtime que pinen versiones exactas.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
